# Weekly database backup.
#
# The company's catalog, stock ledger and every drawing live in one Supabase
# project on the free tier, which has no point-in-time recovery. Without this
# there is no copy of any of it: one mistaken delete, or one project problem,
# and the work is gone permanently.
#
# Runs on GitHub's free minutes and stores the dump as a build artifact.
#
# ── Setup ──────────────────────────────────────────────────────────────────
# Add one repository secret (Settings → Secrets and variables → Actions):
#
#   SUPABASE_DB_URL
#     Supabase dashboard → Connect (top bar, beside the project name) →
#     Session pooler. Paste your database password into it. The string
#     contains that password, so it belongs in a secret and nowhere else.
#
#     It has to be the SESSION POOLER on port 5432. The other two both fail:
#     the transaction pooler (6543) cannot serve pg_dump, and the direct
#     connection resolves to IPv6 only while GitHub's runners are IPv4-only,
#     which fails as "network unreachable" rather than as anything obvious.
#     The host should read `…pooler.supabase.com`, never `db.….supabase.co`.
#
# ── Restoring ──────────────────────────────────────────────────────────────
# Order matters. The accounts have to exist before anything that references
# them, or every insert fails on a foreign key:
#
#   1. create a project and run supabase/migrations/0001…0011 against it
#   2. gunzip -c auth.sql.gz   | psql "$TARGET_DB_URL"
#   3. gunzip -c public.sql.gz | psql "$TARGET_DB_URL"
#
# Uploaded avatars are not in here: storage.objects holds the metadata but the
# files themselves live in object storage. They are re-uploadable and nothing
# depends on them, so they are deliberately out of scope.
#
# A backup nobody has ever restored is a guess, not a backup. Restore one into
# a scratch Supabase project once, so the procedure is known before it matters.

name: Database backup

on:
  schedule:
    # 03:00 UTC every Sunday.
    - cron: '0 3 * * 0'
  # So the first one can be taken now rather than next Sunday.
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    # pg_dump refuses to work against a server newer than itself, so the client
    # comes from the matching major version rather than from Ubuntu's default.
    container: postgres:17-alpine
    steps:
      - name: Dump the company's data
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "SUPABASE_DB_URL is not set — see the header of this file." >&2
            exit 1
          fi
          # --no-owner and --no-privileges keep the dump restorable into a
          # different project, where the role names will not match.
          pg_dump "$SUPABASE_DB_URL" \
            --no-owner --no-privileges \
            --schema=public --schema=storage \
            | gzip -9 > public.sql.gz
          ls -lh public.sql.gz

      - name: Dump the accounts
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          # Without this the rest of the backup does not restore at all.
          #
          # `profiles.id` IS a reference to auth.users(id), and four other
          # columns point there too, so into a fresh project every profile row
          # violates its foreign key and takes the restore down with it. The
          # auth schema is Supabase's to manage, so only the rows are taken —
          # the tables already exist in any project worth restoring into.
          #
          # These rows include password hashes. They are no more sensitive than
          # the drawings sitting beside them in the same artifact, but it is
          # worth knowing that anyone who can read this repository can download
          # both.
          pg_dump "$SUPABASE_DB_URL" \
            --no-owner --no-privileges --data-only \
            --table=auth.users --table=auth.identities \
            | gzip -9 > auth.sql.gz
          ls -lh auth.sql.gz

      - name: Refuse to publish a backup that is not real
        run: |
          set -euo pipefail
          fail=0
          for f in public.sql.gz auth.sql.gz; do
            size=$(stat -c %s "$f")
            echo "$f is ${size} bytes"
            # An empty or error-only dump still exits 0 and still uploads,
            # which would look like a working backup for months.
            case "$f" in
              public.sql.gz) floor=2000 ;;
              # A dump of an empty table is still a few hundred bytes of
              # preamble, so this floor only catches a genuinely absent one.
              auth.sql.gz)   floor=400  ;;
            esac
            if [ "$size" -lt "$floor" ]; then
              echo "  ^ below ${floor} bytes — treating as a failure." >&2
              fail=1
            fi
          done
          # Prove the data is actually in there rather than trusting the size.
          if ! gunzip -c public.sql.gz | grep -q 'COPY public.materials'; then
            echo "public.sql.gz contains no materials data." >&2
            fail=1
          fi
          if ! gunzip -c auth.sql.gz | grep -q 'COPY auth.users'; then
            echo "auth.sql.gz contains no accounts." >&2
            fail=1
          fi
          exit $fail

      - uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: |
            public.sql.gz
            auth.sql.gz
          # GitHub's ceiling for artifacts is 90 days. Anything longer needs
          # somewhere else to put them.
          retention-days: 90
