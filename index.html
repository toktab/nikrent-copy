<!DOCTYPE html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Named for what it does now: this began as a column tool and has since
         grown walls, elevations and a 3D view. Matches the wordmark in the
         header, so the tab and the app agree. -->
    <title>Du ფორმვორკი</title>
    <meta name="description" content="ყალიბის დაგეგმვა, უწყისი და მარაგი" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Without this a phone or tablet paints its own light surround, which
         flashes on load and frames a dark app in white. -->
    <meta name="theme-color" content="#20252b" />

    <!-- A drawing is company data. Nothing here should be indexed, and no
         address should travel out in a referrer header. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
