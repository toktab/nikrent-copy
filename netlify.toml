# Netlify deployment. The equivalent Vercel config lives in vercel.json —
# whichever host is used, the other file is simply ignored.

[build]
  command = "npm run build"
  publish = "dist"

# Single page app: every path has to return index.html, or a refresh on a
# recovery link lands on the host's 404 instead of the app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Vite fingerprints these filenames, so they can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
